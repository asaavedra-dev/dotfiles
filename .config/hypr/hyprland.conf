monitor=,preferred,auto,1

exec-once=waybar
exec-once=swww-daemon
exec-once=caelestia shell -d

input {
    kb_layout=es
}

general {
    gaps_in=5
    gaps_out=10
    border_size=2
}

decoration {
    rounding=10
    blur {
        enabled=true
    }
}

animations {
    enabled=true
}

bind=SUPER,Return,exec,kitty
bind=SUPER,Q,killactive
bind=SUPER,M,exit
#bind=SUPER,R,exec,rofi -show drun

#exec-once=awww-daemon && awww img /home/allyx/wallpaper.jpg

env = XCURSOR_THEME,Yuurei-Angel
env = XCURSOR_SIZE,244

bind = SUPER, L, exec, hyprlock

exec-once = hypridle
exec-once = quickshell -c ~/.config/quickshell/caelestia
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86Launch1, exec, grimblast copy area
bind = , F11, exec, grimblast save screen ~/Imágenes/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = , Print, exec, grimblast save screen ~/Imágenes/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SUPER, E, exec, dolphin
exec-once = sh -c 'sleep 2 && setsid mpvpaper -o "no-audio loop" eDP-1 ~/Videos/wallpapers/shrek-x-miku-driving-a-motorbike-moewalls-com.mp4' > /dev/null 2>&1
exec-once = vicinae server
bind = SUPER, R, exec, vicinae toggle
