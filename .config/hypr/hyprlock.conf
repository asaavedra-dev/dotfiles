background {
    monitor =
    path = /home/allyx/.config/eww/images/spiderman.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.75
}

image {
    monitor =
    path = /home/allyx/.config/eww/images/avatar.jpg
    size = 160
    rounding = -1
    border_size = 3
    border_color = rgba(200, 200, 200, 0.6)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(220, 220, 220, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.25
    outer_color = rgba(200, 200, 220, 0.5)
    inner_color = rgba(20, 20, 30, 0.7)
    font_color = rgb(220, 220, 240)
    fade_on_empty = false
    placeholder_text = <i>contraseña...</i>
    position = 0, -180
    halign = center
    valign = center
}

general {
    hide_cursor = true
}
background {
    monitor =
    path = /home/allyx/Descargas/spiderman.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
